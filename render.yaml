services:
  - type: web
    name: shopbot-mobile-g36-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SELLER_TOKEN
        generateValue: true
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
